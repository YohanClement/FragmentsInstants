spring:
  datasource:
    url: jdbc:sqlite:data/fragments-instants.db?foreign_keys=on
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
springdoc:
  api-docs: 
    path: /v3/api-docs
  swagger-ui: 
    path: /swagger-ui.html
fragments-instants:
  cors: 
    origine-frontend: http://localhost:4200